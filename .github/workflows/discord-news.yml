name: AION 2 News to Discord

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send changed AION 2 news to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          COMMIT_JSON=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")

          FILES=$(printf '%s' "$COMMIT_JSON" \
            | jq -r '.files[]? | select(.status != "removed") | .filename' \
            | grep -E '^20[0-9]{2}-[0-9]{2}-[0-9]{2}/.*[.]md$' \
            | sort -u \
            | head -5 \
            || true)

          echo "Detected news files:"
          printf '%s\n' "$FILES"

          [ -z "$FILES" ] && exit 0

          FIRST_FILE=$(printf '%s\n' "$FILES" | head -1)
          RAW_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${FIRST_FILE}"
          TEXT=$(curl -fsSL "$RAW_URL" || true)

          TITLE=$(printf '%s\n' "$TEXT" | grep -m1 '^# ' | sed 's/^# //' || true)
          [ -z "$TITLE" ] && TITLE="AION 2 Global — нова информация"

          # Remove the first H1 and truncate safely by Unicode characters, not bytes.
          # Discord embed descriptions allow up to 4096 characters; we keep margin.
          DESCRIPTION=$(printf '%s\n' "$TEXT" | sed '1{/^# /d;}' | python3 -c '
import sys
text = sys.stdin.read().strip()
limit = 3400
if len(text) > limit:
    cut = text[:limit]
    if " " in cut:
        cut = cut.rsplit(" ", 1)[0]
    text = cut.rstrip() + "\n\n… **Пълният текст е в GitHub.**"
print(text)
')

          [ -z "$DESCRIPTION" ] && DESCRIPTION="Нова AION 2 информация е добавена в GitHub."

          FILE_URL="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/${FIRST_FILE}"
          COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg file_url "$FILE_URL" \
            --arg commit_url "$COMMIT_URL" \
            --arg path "$FIRST_FILE" \
            '{
              username: "AION 2 News",
              content: ("📰 **Нова AION 2 информация** • [GitHub commit](" + $commit_url + ")"),
              embeds: [{
                title: $title,
                description: $description,
                url: $file_url,
                fields: [
                  {name: "GitHub файл", value: ("`" + $path + "`")},
                  {name: "Пълен текст", value: ("[Отвори новината в GitHub](" + $file_url + ")")}
                ],
                footer: {text: "AION 2 Global Tracker"}
              }]
            }')

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
