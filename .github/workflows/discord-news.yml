name: AION 2 News to Discord

on:
  push:
    branches:
      - main
    paths:
      - "docs/aion-2/news/**/*.md"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send publishable AION 2 news to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          COMMIT_JSON=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")

          FILES=$(printf '%s' "$COMMIT_JSON" \
            | jq -r '.files[]? | select(.status != "removed") | .filename' \
            | grep -E '^docs/aion-2/news/[0-9]{4}/[0-9]{2}/.*[.]md$' \
            | sort -u \
            | head -10 \
            || true)

          [ -z "$FILES" ] && exit 0

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            RAW_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${FILE}"
            TEXT=$(curl -fsSL "$RAW_URL" || true)
            [ -z "$TEXT" ] && continue

            DOCUMENT_TYPE=$(printf '%s\n' "$TEXT" | awk -F': *' '$1=="document_type"{gsub(/["'"'"']/, "", $2); print $2; exit}')
            NOTIFY_DISCORD=$(printf '%s\n' "$TEXT" | awk -F': *' '$1=="notify_discord"{gsub(/[[:space:]]/, "", $2); print tolower($2); exit}')

            [ "$DOCUMENT_TYPE" = "news" ] || continue
            [ "$NOTIFY_DISCORD" = "true" ] || continue

            BODY=$(printf '%s\n' "$TEXT" | awk '
              NR == 1 && $0 == "---" { frontmatter=1; next }
              frontmatter && $0 == "---" { frontmatter=0; next }
              !frontmatter { print }
            ')

            TITLE=$(printf '%s\n' "$BODY" | grep -m1 '^# ' | sed 's/^# //' || true)
            [ -z "$TITLE" ] && TITLE="AION 2 Global — нова информация"

            DESCRIPTION=$(printf '%s\n' "$BODY" | sed '1{/^# /d;}' | python3 -c 'import sys; text=sys.stdin.read().strip(); limit=3800; print(text if len(text) <= limit else text[:limit].rsplit(" ", 1)[0].rstrip() + "\n\n…")')
            [ -z "$DESCRIPTION" ] && DESCRIPTION="Има нова информация за AION 2 Global."

            PAYLOAD=$(jq -n \
              --arg title "$TITLE" \
              --arg description "$DESCRIPTION" \
              '{
                username: "AION 2 News",
                content: "📰 **Нова AION 2 информация**",
                embeds: [{
                  title: $title,
                  description: $description,
                  footer: {text: "AION 2 Global Tracker"}
                }]
              }')

            WEBHOOK_WAIT_URL="$DISCORD_WEBHOOK_URL"
            case "$WEBHOOK_WAIT_URL" in
              *\?*) WEBHOOK_WAIT_URL="$WEBHOOK_WAIT_URL&wait=true" ;;
              *) WEBHOOK_WAIT_URL="$WEBHOOK_WAIT_URL?wait=true" ;;
            esac

            RESPONSE=$(curl --silent --show-error --fail-with-body \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$WEBHOOK_WAIT_URL")

            MESSAGE_ID=$(printf '%s' "$RESPONSE" | jq -r '.id // empty')
            CHANNEL_ID=$(printf '%s' "$RESPONSE" | jq -r '.channel_id // empty')
            if [ -z "$MESSAGE_ID" ] || [ -z "$CHANNEL_ID" ]; then
              echo "Discord прие заявката, но не върна message ID/channel ID." >&2
              exit 1
            fi
            echo "Discord delivery confirmed: message_id=$MESSAGE_ID channel_id=$CHANNEL_ID file=$FILE"
          done <<< "$FILES"
