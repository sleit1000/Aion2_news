name: AION 2 News to Discord

on:
  push:
    branches:
      - main
    paths:
      - '20??-??-??/*.md'
      - '20??-??-??/**/*.md'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send changed AION 2 news to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git show --pretty='' --name-only "$GITHUB_SHA" | grep -E '^20[0-9]{2}-[0-9]{2}-[0-9]{2}/.*\.md$' || true)
          else
            FILES=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -E '^20[0-9]{2}-[0-9]{2}-[0-9]{2}/.*\.md$' || true)
          fi

          [ -z "$FILES" ] && exit 0
          export FILES

          python3 <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          files = [f for f in os.environ.get("FILES", "").splitlines() if f][:5]

          embeds = []
          for file in files:
              path = pathlib.Path(file)
              if not path.is_file():
                  continue

              text = path.read_text(encoding="utf-8", errors="replace")
              lines = text.splitlines()
              title = next((line[2:].strip() for line in lines if line.startswith("# ")), path.stem)

              body_lines = []
              skipped_title = False
              for line in lines:
                  if not skipped_title and line.startswith("# "):
                      skipped_title = True
                      continue
                  body_lines.append(line)

              description = "\n".join(body_lines).strip()
              if not description:
                  description = "Нова AION 2 информация е добавена в GitHub."
              if len(description) > 1500:
                  description = description[:1497] + "..."

              embeds.append({
                  "title": title[:250],
                  "description": description,
                  "url": f"https://github.com/{repo}/blob/{sha}/{file}",
                  "fields": [
                      {"name": "GitHub файл", "value": f"`{file}`", "inline": False}
                  ],
                  "footer": {
                      "text": "AION 2 Global Tracker • виж статуса и източниците в пълния отчет"
                  }
              })

          if not embeds:
              raise SystemExit(0)

          payload = {
              "username": "AION 2 News",
              "content": f"📰 **Нова AION 2 информация** • [GitHub commit](https://github.com/{repo}/commit/{sha})",
              "embeds": embeds,
          }

          data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
          PY
